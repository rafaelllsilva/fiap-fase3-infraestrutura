# Manifesto de Secret exigido pelo enunciado (item 3.2). Os valores são
# injetados pelo Terraform em tempo de apply (variáveis db_password /
# jwt_secret) via templatefile() em infra/main.tf — não ficam versionados
# no Git.
apiVersion: v1
kind: Secret
metadata:
  name: db-credentials
  namespace: tech-challenge
type: Opaque
stringData:
  password: "${db_password}"
---
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: tech-challenge
type: Opaque
stringData:
  jwt-secret: "${jwt_secret}"
