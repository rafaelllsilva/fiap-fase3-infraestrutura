---
apiVersion: v1
kind: Service
metadata:
  name: postgres-service
  namespace: tech-challenge
spec:
  ports:
    - port: 5432
      targetPort: 5432
  selector:
    app: postgres_db
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: tech-challenge
spec:
  serviceName: "postgres-service"
  replicas: 1
  selector:
    matchLabels:
      app: postgres_db
  template:
    metadata:
      labels:
        app: postgres_db
    spec:
      securityContext:
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
      containers:
        - name: postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 5432
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: password
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: db-config
                  key: DB_NAME
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: db-config
                  key: DB_USER
          # Readiness só fica true quando o Postgres aceita conexões — assim o
          # Terraform espera o banco pronto de fato antes de subir a app.
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "tech", "-d", "tech_challenge"]
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
          volumeMounts:
            - mountPath: /var/lib/postgresql/data
              name: postgres-storage
  volumeClaimTemplates:
    - metadata:
        name: postgres-storage
      spec:
        # Sem storageClassName: usa a StorageClass padrão do cluster. No Kind
        # é o local-path provisioner (standard), que provisiona o PVC sozinho.
        # No EKS não existe default de fábrica (a "gp2" que a AWS cria não é
        # anotada como default e usa o provisionador in-tree já removido do
        # Kubernetes), então quem supre isso é o kubernetes_storage_class_v1
        # .ebs_gp3 em infra/main.tf. Sem ele o PVC fica Pending para sempre.
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
