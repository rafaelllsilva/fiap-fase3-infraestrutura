# Manifesto de Secret exigido pelo enunciado (item 3.2). O valor é injetado
# pelo Terraform em tempo de apply (variável db_password) via templatefile()
# em infra/main.tf — não fica versionado no Git.
apiVersion: v1
kind: Secret
metadata:
  name: db-credentials
  namespace: tech-challenge
type: Opaque
stringData:
  password: "${db_password}"
