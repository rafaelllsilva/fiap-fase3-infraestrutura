apiVersion: newrelic.com/v1beta2
kind: Instrumentation
metadata:
  name: newrelic-instrumentation
  namespace: newrelic
spec:
  # A workflow mantém esta chave nos namespaces newrelic e tech-challenge.
  licenseKeySecret: newrelic-key-secret
  agent:
    language: java

    image: newrelic/newrelic-java-init:9.4.0@sha256:f98d055a40a57a1fe3c21cb536a738c30862b5b204acb4afd8886e434dc30818
    env:
      - name: NEW_RELIC_APP_NAME
        value: execution-service
      - name: NEW_RELIC_DISTRIBUTED_TRACING_ENABLED
        value: "true"
      - name: NEW_RELIC_APPLICATION_LOGGING_ENABLED
        value: "true"
      - name: NEW_RELIC_APPLICATION_LOGGING_FORWARDING_ENABLED
        value: "false"
      - name: NEW_RELIC_APPLICATION_LOGGING_LOCAL_DECORATING_ENABLED
        value: "true"

  # Restringir a instrumentação ao workload existente do execution.
  namespaceLabelSelector:
    matchExpressions:
      - key: "kubernetes.io/metadata.name"
        operator: "In"
        values: ["tech-challenge"]

  podLabelSelector:
    matchExpressions:
      - key: "app"
        operator: "In"
        values: ["execution-service"]

  containerSelector:
    # Campo exigido pelo CRD do operador 0.50.0 incluído no bundle 8.0.22.
    envSelector: {}
    nameSelector:
      matchExpressions:
        - key: "container"
          operator: "In"
          values: ["execution-service"]
