# Manifesto de Secret exigido pelo enunciado (item 3.2). O valor é injetado
# pelo Terraform em tempo de apply (variável jwt_secret) via templatefile()
# em infra/main.tf — não fica versionado no Git.
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: tech-challenge
type: Opaque
stringData:
  jwt-secret: "${jwt_secret}"
