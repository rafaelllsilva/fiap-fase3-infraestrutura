# Provisiona o cluster EKS
name: Terraform Apply

on:
  push:
    branches: [main]
    paths:
      - "infra/**"
      - ".github/workflows/terraform-*.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terraform-infra-state
  cancel-in-progress: false

env:
  TF_VERSION: "1.14.0"
  AWS_REGION: us-east-1

jobs:
  apply:
    runs-on: ubuntu-latest
    environment: prod
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      # Credenciais de sessão do AWS Academy Lab
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Criar bucket S3 do backend
        run: sh script-criar-backend.sh

      - name: Executar init
        run: terraform -chdir=infra init -input=false

      - name: Executar apply
        run: terraform -chdir=infra apply -input=false -no-color -auto-approve

      - name: Exibir outputs
        run: terraform -chdir=infra output

      # Exibir outputs específicos para integração com outras pipelines
      - name: "Outputs de integração: VPC, subnets privadas e security group"
        run: |
          echo "vpc_id:"
          terraform -chdir=infra output vpc_id
          echo
          echo "private_subnet_ids:"
          terraform -chdir=infra output private_subnet_ids
          echo
          echo "cluster_security_group_id:"
          terraform -chdir=infra output cluster_security_group_id
